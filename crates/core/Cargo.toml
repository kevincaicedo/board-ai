[package]
name = "boardai-core"
description = "BoardAI's pure, deterministic core: conversation, narration, board and memory policy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The conversation simulator (fake clock, speech and talker) for tests and the runtime's text
# dev loop. Never enabled in the shipped app.
sim = []

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat", "no-serde-warnings"] }

[dev-dependencies]
# The crate's own integration tests run with the simulator.
boardai-core = { path = ".", features = ["sim"] }
